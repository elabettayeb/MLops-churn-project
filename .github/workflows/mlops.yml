name: Telecom Churn MLOps Pipeline

on: [push, pull_request]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup DVC
        run: |
          python -m dvc init --no-scm -f
          mkdir -p dvc_remote
          python -m dvc remote add -d localremote dvc_remote/

      - name: Get DVC data
        run: |
          # For CI, we expect `data/raw/telecom_churn.csv` to be present.
          # Replace this with a real download URL or secure artifact in production.
          mkdir -p data/raw
          echo "Please add your Telecom Churn dataset to data/raw/telecom_churn.csv in your CI environment."

      - name: Run DVC Pipeline
        run: |
          python -m dvc repro

      - name: Display Metrics
        run: |
          echo "Pipeline successful."
          echo "Recent MLflow runs:"
          python -m mlflow experiments search
          # Listing runs by ID (ID 1 refers to the experiment id in the CI environment)
          python -m mlflow runs list --experiment-id 1 || true

      - name: Log results to MLflow
        run: |
          echo "MLflow logs created."
