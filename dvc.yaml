stages:
  clean_data:
    cmd: python src/clean_data.py
    deps:
      - data/raw/telecom_churn.csv
      - src/clean_data.py
    outs:
      - data/interim/cleaned_churn.csv
  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - data/interim/cleaned_churn.csv
      - src/feature_engineering.py
    outs:
      - data/processed/final_churn.csv
  training:
    cmd: python src/train.py
    deps:
      - data/processed/final_churn.csv
      - src/train.py
    # MLflow runs are not tracked as DVC outs unless we log them as such,
    # but we'll track metrics in dvc if we had a metrics file.
    # For now, we'll just track the input data and the training script.
  registration:
    cmd: python src/register_model.py
    deps:
      - src/register_model.py
      - src/train.py
      - data/processed/final_churn.csv
    # Depends on the training outputs and registration script
